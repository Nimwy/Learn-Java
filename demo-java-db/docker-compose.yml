services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner
      POSTGRES_DB: remoteit_learning
    ports:
      - "5433:5432"
    volumes:
      - pddata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d remoteit_learning"]
      interval: 3s
      retries: 10
  app:
    build: .
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pddata: