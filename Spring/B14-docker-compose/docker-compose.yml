services:
  web:
    build: .
    image: bai14-web
    container_name: bai14-web
    ports:
      - "8090:80" 
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bai14-redis
    volumes:
      - redis-data:/data 

volumes:
  redis-data:
