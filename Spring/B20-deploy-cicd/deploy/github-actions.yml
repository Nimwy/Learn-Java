name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + test
        run: mvn -B verify

      - name: Upload jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: target/*.jar

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          JAR=$(ls app/*.jar | head -n 1)
          scp -i ~/.ssh/id_ed25519 "$JAR" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/remoteit/app.jar.new"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              sudo mv /opt/remoteit/app.jar /opt/remoteit/app.jar.previous
              sudo mv /opt/remoteit/app.jar.new /opt/remoteit/app.jar
              sudo systemctl restart remoteit
            '

      - name: Health check
        run: curl -fsS https://api.example.com/actuator/health
