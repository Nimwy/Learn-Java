spring.main.banner-mode=off
logging.level.root=warn
# Hiện log của Flyway để thấy nó chạy migration nào
logging.level.org.flywaydb=info
# Từ bài 13: bật log request của RequestLoggingFilter
logging.level.http.access=info
logging.level.com.example.remoteit=info
# Từ bài 13: thêm [%X{requestId}] vào mỗi dòng log của console.
# %X{requestId} lấy giá trị requestId từ MDC do RequestLoggingFilter đặt.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{20} - %msg%n
# Không truyền profile thì dùng dev (tiện khi học local).
spring.profiles.default=dev

# ------------------------------------------------------------------
# MỚI (bài 10): Flyway quản lý schema, KHÔNG để Hibernate tạo bảng nữa.
#   - Bỏ ddl-auto=create (xóa + tạo lại bảng mỗi lần chạy)
#   - validate: Hibernate chỉ KIỂM TRA entity có khớp bảng Flyway tạo không, không tự sửa
#   - Flyway chạy các file src/main/resources/db/migration/V*.sql lúc khởi động
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# TIMESTAMP không mang timezone: đọc/ghi theo UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Cả DEFAULT now() trong migration cũng phải dùng UTC.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# Mặc định đã bật khi có flyway-core trong pom; ghi ra cho rõ
spring.flyway.enabled=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# Bài 15: Spring Cache dùng Redis làm nơi lưu cache.
#   - type=redis: chọn RedisCacheManager thay vì cache trong bộ nhớ.
#   - time-to-live=5m: entry tự hết hạn sau 5 phút, tránh dữ liệu cũ vô hạn.
#   - host/port đọc từ biến môi trường để đổi khi deploy.
# ------------------------------------------------------------------
spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ------------------------------------------------------------------
# Bài 16: RabbitMQ — nơi nhận message từ @Async listener.
#   - user/password đọc từ biến môi trường để đổi khi deploy.
#   - compose tạo sẵn user remoteit/remoteit cho môi trường học.
# ------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:remoteit}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:remoteit}

# Chỉ mở health check; bài này không cần metrics.
management.endpoints.web.exposure.include=health
# Chi tiết database/Redis/RabbitMQ chỉ hiện ở dev (xem application-dev.properties).
management.endpoint.health.show-details=never
