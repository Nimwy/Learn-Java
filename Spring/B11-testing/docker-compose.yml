# PostgreSQL cho bài 11 khi chạy app thủ công.
# Test @DataJpaTest tự khởi động PostgreSQL bằng Testcontainers, không cần compose.
services:
  postgres:
    image: postgres:16
    container_name: bai11-postgres
    environment:
      POSTGRES_DB: remoteit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
