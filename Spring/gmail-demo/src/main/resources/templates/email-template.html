<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông báo tuyển dụng</title>
</head>
<body style="margin: 0; padding: 24px; background-color: #f3f4f6;
             font-family: Arial, sans-serif; color: #1f2937;">

    <div style="max-width: 600px; margin: auto; background: white;
                padding: 28px; border-radius: 12px;">

        <h2 style="color: #2563eb;">Xin chào,
            <span th:text="${recipientName}">Người nhận</span>!
        </h2>

        <p th:text="${message}">
            Đây là nội dung email mẫu.
        </p>

        <p>Thông tin này được gửi tự động từ ứng dụng Java.</p>

        <hr style="border: 0; border-top: 1px solid #e5e7eb;">

        <p style="font-size: 12px; color: #6b7280;">
            Email demo — vui lòng không trả lời email này.
        </p>
    </div>
</body>
</html>
