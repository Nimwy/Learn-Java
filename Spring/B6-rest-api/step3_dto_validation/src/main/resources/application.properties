# Kết nối DB (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5433/remoteit
spring.datasource.username=postgres
spring.datasource.password=postgres

# create = xóa bảng cũ và tự tạo lại mỗi lần chạy (CHỈ dùng khi học)
spring.jpa.hibernate.ddl-auto=create
# Không giữ kết nối DB mở suốt request (nên tắt với REST API)
spring.jpa.open-in-view=false

# Tắt banner và bớt log để dễ nhìn
spring.main.banner-mode=off
logging.level.root=warn