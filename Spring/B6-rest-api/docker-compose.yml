# PostgreSQL cho bài 6. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: bai06-postgres
    environment:
      POSTGRES_DB: remoteit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # dùng cổng 5433 để không trùng nếu máy đã cài PostgreSQL ở 5432