# PostgreSQL cho bài 12. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: bai12-postgres
    environment:
      POSTGRES_DB: remoteit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # dùng 5433 để không trùng PostgreSQL cài sẵn ở 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
