spring.application.name=api-complete
spring.main.banner-mode=off
server.port=8080

logging.level.root=warn
logging.level.com.example.remoteit=info

spring.datasource.url=jdbc:postgresql://localhost:5433/remoteit
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway tạo bảng/index; Hibernate chỉ kiểm tra entity khớp schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.flyway.enabled=true

# Giới hạn size tối đa để client không gửi size=100000.
spring.data.web.pageable.max-page-size=50

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
