spring.application.name=file-storage
spring.main.banner-mode=off
server.port=8080

logging.level.root=warn
logging.level.com.example.remoteit=info

# Giới hạn upload để tránh một file quá lớn làm đầy RAM/ổ đĩa.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ------------------------------------------------------------------
# Bài 18: MinIO/S3
#   - endpoint: MinIO chạy local; trên AWS S3 có thể bỏ endpointOverride.
#   - access-key/secret-key: chỉ dùng cho học local.
#   - bucket: nơi chứa object; app tự tạo nếu chưa có.
#   - region: MinIO không quan tâm lắm, nhưng SDK cần một giá trị.
# ------------------------------------------------------------------
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9100}
app.storage.access-key=${MINIO_ACCESS_KEY:remoteit}
app.storage.secret-key=${MINIO_SECRET_KEY:remoteit123}
app.storage.bucket=${MINIO_BUCKET:remoteit-files}
app.storage.region=${MINIO_REGION:us-east-1}
